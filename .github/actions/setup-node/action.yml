name: Setup Node.js
description: Install the workspace pnpm and Node.js versions and restore the pnpm store
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6.1.0
    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: package.json
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          package.json
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
