name: Build and publish installers

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      targets:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RIMR_RELEASE_SHA: ${{ inputs.sha }}
  RIMR_RELEASE_TAG: ${{ inputs.tag }}
  RIMR_RELEASE_VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.targets) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-linux
        if: runner.os == 'Linux'
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
          cache-key: release
      - name: Build native installers
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for variable in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!variable}" ]]; then unset "$variable"; fi
          done
          pnpm bundle
      - name: Verify and collect installers
        run: node .github/scripts/artifacts.mjs collect ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installers-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: installers-*
          path: dist-release
          merge-multiple: true
      - name: Verify assets and publish through a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/publish.mjs
