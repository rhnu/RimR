[package]
name = "rimr-tauri"
version.workspace = true
description.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[package.metadata.tauri-winres]
OriginalFilename = "RimR.exe"
InternalName = "RimR"
Comments = "A RimWorld mod manager."

[lib]
name = "rimr_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
directories = { workspace = true }
image = { workspace = true, features = ["jpeg", "png", "webp"] }
regex = { workspace = true }
rimr-bindings = { workspace = true }
rimr-core = { workspace = true }
rimr-steam = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
steamlocate = { workspace = true }
tauri = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-opener = { workspace = true }
tracing = { workspace = true, features = ["log"] }
log = { workspace = true }
tauri-plugin-dialog = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
trash = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-window-state = { workspace = true }
