[workspace]
members = ["modules/rimr-bindings", "modules/rimr-core", "modules/rimr-steam", "app/src-tauri", "xtask"]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2024"
authors = ["Rhynia"]
license = "GPL-3.0"
description = "A RimWorld mod manager."

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = "4.6.7"
directories = "6.0.0"
flate2 = "1.1.10"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false }
indexmap = "2.14.2"
keyvalues-serde = "0.2.4"
log = "0.4.34"
quick-xml = "0.42.0"
regex = "1.13.1"
rimr-bindings = { path = "modules/rimr-bindings" }
rimr-core = { path = "modules/rimr-core" }
rimr-steam = { path = "modules/rimr-steam" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
steamlocate = "2.1.1"
tauri = "2.12.5"
tauri-build = "2.7.4"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-log = "2.10.1"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = "0.3.55"
tokio = "1.54.1"
tracing = "0.1.44"
trash = "5.2.9"
ts-rs = "12.0.1"
zstd = "0.14.3"
